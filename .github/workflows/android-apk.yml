name: Android Kiosk APK

# MANUAL-ONLY build of the kiosk APK.
#
# Run it from the Actions tab ("Run workflow") whenever you want a new APK.
# Nothing is built on push — the APK is installed by hand on kiosk devices.
#
# Version: versionCode MUST be higher than the one already installed
# (the in-app updater compares versionCode) — e.g. 1 → 2 → 3.
#
# Signing: the APK is signed with the release keystore stored in the repo
# SECRETS (DSM_KEYSTORE_BASE64, DSM_KEYSTORE_PASSWORD, DSM_KEY_ALIAS,
# DSM_KEY_PASSWORD). If the keystore secret is missing, the build produces an
# UNSIGNED APK and says so loudly — such an APK cannot update an installed
# one (signature mismatch), it is only useful for a fresh install.
#
# Optional: tick "publish_release" to publish the APK as a GitHub Release
# asset — that asset URL + its sha256 go into the backend release registry
# (warden dashboard → Updates).

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (integer, must be HIGHER than the installed one)'
        required: true
        default: '2'
      version_name:
        description: 'versionName (e.g. 1.1.0)'
        required: true
        default: '1.1.0'
      publish_release:
        description: 'Create a GitHub Release with the APK'
        type: boolean
        default: false
      mandatory:
        description: 'Mandatory — kiosks are BLOCKED until they install this build'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.DSM_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DSM_KEYSTORE_BASE64 secret is not set — building an UNSIGNED APK (fresh installs only)."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${KEYSTORE_B64}" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_OUTPUT"

      - name: Write local.properties
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.DSM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DSM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DSM_KEY_PASSWORD }}
        run: |
          mkdir -p android-kiosk
          {
            echo "API_BASE_URL=${API_BASE_URL:-https://api.dsssolutions.in}"
            echo "SIGNALING_URL=${SIGNALING_URL:-https://signal.dsssolutions.in}"
            echo "AUTO_LOGOUT_TIMEOUT_MS=120000"
            if [ -n "${KEYSTORE_PATH}" ]; then
              echo "KEYSTORE_PATH=${KEYSTORE_PATH}"
              echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
              echo "KEY_ALIAS=${KEY_ALIAS}"
              echo "KEY_PASSWORD=${KEY_PASSWORD}"
            fi
          } > android-kiosk/local.properties
          cat android-kiosk/local.properties

      - name: Build release APK
        working-directory: android-kiosk
        env:
          DSM_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          DSM_KEYSTORE_PASSWORD: ${{ secrets.DSM_KEYSTORE_PASSWORD }}
          DSM_KEY_ALIAS: ${{ secrets.DSM_KEY_ALIAS }}
          DSM_KEY_PASSWORD: ${{ secrets.DSM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease \
            -PversionCode="${{ inputs.version_code }}" \
            -PversionName="${{ inputs.version_name }}" \
            --console=plain --stacktrace

      - name: Collect APK + checksum
        id: apk
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find android-kiosk/app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then echo "::error::no APK produced"; exit 1; fi
          cp "$APK" "dist/kiosk-${{ inputs.version_name }}.apk"
          cd dist
          sha256sum "kiosk-${{ inputs.version_name }}.apk" | tee "kiosk-${{ inputs.version_name }}.apk.sha256"
          {
            echo "file=kiosk-${{ inputs.version_name }}.apk"
            echo "sha256=$(cut -d' ' -f1 "kiosk-${{ inputs.version_name }}.apk.sha256")"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Kiosk APK built"
            echo ""
            echo "- versionName: \`${{ inputs.version_name }}\`"
            echo "- versionCode: \`${{ inputs.version_code }}\`"
            echo "- signed: \`${{ steps.keystore.outputs.signed == 'true' }}\`"
            echo "- sha256: \`${{ steps.apk.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-apk-${{ inputs.version_name }}
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error

      - name: Publish release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          # Deterministic tag/asset URL — the registry entry points at it.
          tag_name: v${{ inputs.version_name }}
          name: Kiosk ${{ inputs.version_name }}
          body: |
            Kiosk APK ${{ inputs.version_name }} (versionCode ${{ inputs.version_code }}).

            ```
            ${{ steps.apk.outputs.sha256 }}  ${{ steps.apk.outputs.file }}
            ```
          files: |
            dist/*.apk
            dist/*.sha256

      # The build publishes ITSELF to the release registry — so the version is
      # written exactly once (here). Kiosks learn about it through the
      # heartbeat they already send; no extra request anywhere.
      - name: Publish to the release registry
        if: ${{ inputs.publish_release }}
        env:
          API_URL: ${{ vars.DSM_API_URL || 'https://api.dsssolutions.in' }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::warning::RELEASE_PUBLISH_TOKEN secret is not set — the registry entry was NOT created."
            exit 0
          fi
          BODY="{
            \"app\": \"kiosk\",
            \"platform\": \"android\",
            \"version\": \"${{ inputs.version_name }}\",
            \"versionCode\": ${{ inputs.version_code }},
            \"mandatory\": ${{ inputs.mandatory }},
            \"downloadUrl\": \"https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version_name }}/${{ steps.apk.outputs.file }}\",
            \"sha256\": \"${SHA256}\",
            \"notes\": \"Kiosk ${{ inputs.version_name }}\"
          }"
          CODE=$(curl -sS -o "$RUNNER_TEMP/registry.json" -w "%{http_code}" \
            -X POST "${API_URL}/app-releases" \
            -H "Content-Type: application/json" \
            -H "X-Release-Token: ${RELEASE_TOKEN}" \
            -d "$BODY")
          cat "$RUNNER_TEMP/registry.json"
          if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
            echo "::notice::release published to the registry — kiosks will pick it up on their next heartbeat"
          else
            echo "::error::registry publish failed (HTTP $CODE)"
            exit 1
          fi
