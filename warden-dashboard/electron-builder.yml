appId: com.dssmeet.warden
productName: DssMeet Warden
copyright: Copyright © DssMeet

directories:
  output: release

files:
  - electron/**
  - dist/**
  - package.json

asar: true
npmRebuild: false

# Windows 10/11 (Electron 45 does not support Windows 7/8 — ship the web URL
# on those machines instead).
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DssMeet Warden

# AppImage runs on Ubuntu/Kali/any modern distro without install; deb covers
# the Debian/Ubuntu family directly.
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Office
  synopsis: DssMeet Warden & Admin Console
  maintainer: DssMeet <admin@dsssolutions.in>
  mimeTypes:
    - x-scheme-handler/app
