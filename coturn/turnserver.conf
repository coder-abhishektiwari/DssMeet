# DssMeet coturn configuration (shared by dev + production compose).
# No secrets in this file: production (docker-compose.prod.yml) appends
#   external-ip=<VPS_PUBLIC_IP>  and  user=<TURN_USER>:<TURN_PASS>
# from .env at container start. Dev signaling reads TURN_URL / TURN_TCP_URL
# from its own .env, so this conf is only live in production.

listening-port=3478
tls-listening-port=5349

realm=dssmeet.local
server-name=dssmeet.local

# Long-term credential mechanism (static user= appended at container start).
lt-cred-mech

# UDP/TCP relay range (matches docker-compose port mappings).
min-port=49160
max-port=49200

# No CLI/admin port over the network.
no-cli

# TLS
cert=/etc/coturn/certs/turn_server_cert.pem
pkey=/etc/coturn/certs/turn_server_pkey.pem

# Logging
log-file=stdout
simple-log

# Behaviour
fingerprint
no-multicast-peers
# no-tcp-relay — disabled so coturn can relay TCP for TURN entries
# requesting transport=tcp in the ICE server list.
# (allow-loopback-peers removed for production — peers are never loopback
# there; local same-host testing uses dev compose + STUN/loopback host candidates.)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255

# external-ip is appended at container start by docker-compose.prod.yml
# (VPS_PUBLIC_IP from .env) — the old playit-tunnel IP must never return to git.

# Relay on all interfaces (Docker).
relay-ip=0.0.0.0
